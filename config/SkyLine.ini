[Overlay]
; Enable/disable the mod
bEnabled=1

; text size in pixels at 96 dpi
iFontSize=16

; 0 = ignore Windows display scaling
bDpiScaling=1

; seconds "Startup finished" line stays on screen after 100% load (0 = closes right after the main menu is loaded)
iLingerSeconds=0

; image shown in the splash screen. Relative or absolute path.
; jpg, png or bmp, between 3:1 and 4:3
sSplashImage=SkyLineSplash.jpg

; 0 = disable splash window
bSplash=1

; splash width in pixels at 96 dpi, the height follows the image. Limited to what fits on the monitor.
iSplashWidth=480

; 1 = only the progress bar, without showing what is loading
bBarOnly=0

; 0 = disable the second line with more detailed info about what is loading
bShowDetail=1

; text color, RRGGBB hex
sTextColor=ECECEC

; 0 = disable the shadow/glow behind the text
bTextShadow=1

; progress bar color, RRGGBB hex
sBarColor=6EB4E6

; progress bar thickness and length in pixels at 96 dpi. iBarLength=0 if you want the max length.
iBarHeight=4
iBarLength=360

; Possible positions inside the Skyrim window: TopLeft, Top, TopRight, Left, Center, Right, BottomLeft, Bottom, BottomRight
sPosition=BottomLeft

; Offsets in pixels at 96 dpi (positive is right and down)
iOffsetX=0
iOffsetY=0

; 0 = disable writing to SkyLine.log
bLog=1
